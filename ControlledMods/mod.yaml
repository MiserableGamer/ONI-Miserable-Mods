title: ControlledMods
description: "Allows you to customize and override settings from other mods via an in-game options menu.\n\n== Supported Mods ==\n\n[Resource Sensor (Berkay's mod)]\n• Sidescreen: Atmosphere / Storage / Conduits checkboxes; range visualizer clears on deselect\n• Counting: atmosphere, any storage building, gas/liquid/solid conduits; category tags supported\n\n[KIN Underground Conduit]\n• Fix Power Terminal + logic wire crash\n• Copy Settings for conduit terminals/senders/receivers (channel is copied)\n\n== Features ==\n• Options only apply if the target mod is detected\n• All settings accessible from the main menu Mod Options\n• Requires game restart after changing settings\n\n== More mods coming soon! =="
staticID: MiserableGamer.ControlledMods
supportedContent: ALL
