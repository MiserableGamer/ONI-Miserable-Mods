title: Controlled Mods
description: "Allows you to customize and override settings from other mods via an in-game options menu.\n\n== Supported Mods ==\n\n[Resource Sensor (Berkay's mod)] https://steamcommunity.com/sharedfiles/filedetails/?id=2911545239\n• Sidescreen: Atmosphere / Storage / Conduits scope checkboxes; range visualizer clears on deselect\n• Counting: atmosphere, storage buildings, gas/liquid/solid conduits; category tags expanded\n• Threshold: max 9,999,999; units stripped from display; input limit raised to 8 chars\n• Inversion support when ControlledAutomation is loaded\n\n[Free Resource Buildings] https://steamcommunity.com/sharedfiles/filedetails/?id=2839006500\n• Free Energy Generator wattage slider fix; Power Sink building\n\n[Customize Plants] https://steamcommunity.com/sharedfiles/filedetails/?id=1818145851\n• VineBranch max_age (e.g. instant fruit drop for ovagro)\n\n[KIN Underground Conduit] https://steamcommunity.com/sharedfiles/filedetails/?id=3347169088\n• Fix Power Terminal + logic wire crash\n• Copy Settings for conduit terminals/senders/receivers (channel is copied)\n\n== Features ==\n• Restart button on the main menu (above Quit) for quick restarts\n• Options only apply if the target mod is detected\n• All settings accessible from the main menu Mod Options\n• Requires game restart after changing settings\n\n== More mods coming soon! =="
staticID: MiserableGamer.ControlledMods
supportedContent: ALL
