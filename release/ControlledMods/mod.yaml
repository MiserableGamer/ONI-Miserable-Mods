title: ControlledMods
description: "Allows you to customize and override settings from other mods via an in-game options menu.\n\n== Supported Mods ==\n\n[Ronivan's Legacy]\nReservoir capacity adjustments:\n• Medium Gas Reservoir (default 750 kg, up to 1,000t)\n• Medium Liquid Reservoir (default 7,500 kg, up to 1,000t)\n• Small Gas Reservoir (default 250 kg, up to 50t)\n• Small Liquid Reservoir (default 2,500 kg, up to 50t)\n• Wall Gas Tank (default 150 kg, up to 25t)\n• Wall Liquid Tank (default 1,500 kg, up to 25t)\n\n== Features ==\n• Options only apply if the target mod is detected\n• All settings accessible from the main menu Mod Options\n• Requires game restart after changing settings\n\n== More mods coming soon! =="
supportedContent: ALL
