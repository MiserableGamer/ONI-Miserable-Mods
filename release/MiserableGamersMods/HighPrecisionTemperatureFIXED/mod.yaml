title: High Precision Temperature FIXED
description: "Displays temperatures with 4 decimal places instead of the default 1 decimal place. A fixed and updated version of the original High Precision Temperature mod.\n\n== Features ==\n\n• Shows temperature values like 25.1234°C instead of 25.1°C\n• Works with all temperature units (Celsius, Fahrenheit, Kelvin)\n• Useful for precise thermal management and debugging\n\n== Why This Mod? ==\n\nThe original High Precision Temperature mod stopped working due to game updates. This version uses a more robust patching approach that should survive future updates."
supportedContent: ALL
